<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Carte de visite digitale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14; --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --line:rgba(255,255,255,.14);
  --ink:#f2f6ff; --muted:#9aa8c7; --a1:#19e3c6; --a2:#7c5cff; --grad:linear-gradient(135deg,var(--a1),var(--a2));
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;font-family:"Bricolage Grotesque","Cairo",system-ui,sans-serif;color:var(--ink);overflow-x:hidden;
  padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));display:flex;justify-content:center}
body[dir=rtl]{font-family:"Cairo","Bricolage Grotesque",system-ui,sans-serif}
/* aurora */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:.38;animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--a2);top:-25vmax;left:-20vmax}
.aurora i:nth-child(2){background:var(--a1);bottom:-30vmax;right:-22vmax;animation-delay:-6s;opacity:.28}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
/* intro */
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .6s,visibility .6s}
#intro.off{opacity:0;visibility:hidden}
.tap{position:relative;width:120px;height:120px;display:grid;place-items:center}
.tap b{position:absolute;inset:0;border-radius:50%;border:2px solid var(--a1);opacity:0;animation:ping 1.5s ease-out infinite}
.tap b:nth-child(2){animation-delay:.4s}.tap b:nth-child(3){animation-delay:.8s}
.tap svg{width:44px;height:44px;stroke:var(--a1);fill:none;stroke-width:1.8;stroke-linecap:round}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
#intro p{position:absolute;bottom:30vh;color:var(--muted);font-size:15px}
/* card */
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.rise{opacity:0;transform:translateY(18px);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d,0)*90ms + var(--base,0s))}
@keyframes rise{to{opacity:1;transform:none}}
.langs{display:flex;justify-content:flex-end;gap:6px}
.langs button{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.langs button[aria-pressed=true]{color:#06121a;background:var(--grad);border-color:transparent}
.hero{background:var(--glass);border:1px solid var(--line);border-radius:30px;padding:0 24px 26px;overflow:hidden;text-align:center;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.cover{height:130px;margin:0 -24px;background:var(--grad);position:relative;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar{width:128px;height:128px;margin:-64px auto 18px;position:relative;box-shadow:0 0 0 6px #0d1424;border-radius:50%;padding:4px;background:conic-gradient(from 0deg,var(--a1),var(--a2),var(--a1));animation:spin 8s linear infinite}
.avatar>div{width:100%;height:100%;border-radius:50%;background:#101a2c;display:grid;place-items:center;font-size:44px;font-weight:800;overflow:hidden;animation:spin 8s linear infinite reverse}
.avatar>div{position:relative}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.role{margin-top:8px;color:var(--muted);font-size:16px}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 14px;border-radius:999px;background:rgba(25,227,198,.1);color:var(--a1);font-size:13px;font-weight:600}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--a1);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(25,227,198,.6)}100%{box-shadow:0 0 0 10px rgba(25,227,198,0)}}
.bio{margin:16px auto 0;max-width:34ch;line-height:1.6;font-size:15px;color:#cdd7ee}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;border-radius:20px;background:var(--glass);border:1px solid var(--line);
  color:var(--ink);text-decoration:none;font-size:12px;font-weight:600;transition:transform .2s,background .2s}
.act:hover,.act:active{transform:translateY(-3px);background:var(--glass2)}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--grad);color:#06121a}
.ico.br{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.ico svg.f{fill:currentColor;stroke:none}
.soc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.soc a{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--glass2);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;transition:transform .2s}
.soc a:hover,.soc a:active{transform:translateY(-2px)}
.ico svg,.pill svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cta{display:grid;grid-template-columns:1fr auto;gap:10px}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:18px;padding:16px;cursor:pointer;color:#06121a;background:var(--grad);box-shadow:0 10px 30px -8px rgba(124,92,255,.6);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:none;padding:16px 22px}
.sec{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:20px}
.sec h2{font-size:15px;font-weight:600;color:var(--muted);margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{padding:9px 15px;border-radius:999px;background:var(--glass2);font-size:14px;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:14px;background:var(--glass2);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
.pill svg{color:var(--a1)}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 6px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal a{flex:0 0 72%;aspect-ratio:4/5;border-radius:18px;overflow:hidden;scroll-snap-align:center;background:var(--glass2)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#06121a;font-weight:600;padding:12px 20px;border-radius:999px;transition:.3s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
a:focus-visible,button:focus-visible{outline:3px solid var(--a1);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.rise{opacity:1;transform:none}}
</style>
</head>

const SOC_ORDER = ["instagram","facebook","linkedin","tiktok","youtube","x","snapchat","telegram"];
const brand = k => `<span class="ico br" style="background:${BR[k].bg};color:${BR[k].fg}"><svg class="f" viewBox="0 0 24 24" aria-hidden="true"><path d="${BR[k].p}"/></svg></span>`;
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang = P.defaultLang || 'fr';
try { const s = localStorage.getItem('lang'); if (UI[s]) lang = s; } catch(e){}
const tx = v => (v && typeof v === 'object') ? (v[lang] || v.fr || '') : (v || '');
const netIcon = u => ['instagram','facebook','linkedin','tiktok','youtube'].find(n => u.includes(n)) || 'link';
const fullName = `${P.firstName} ${P.lastName}`.trim();
const initials = ((P.firstName[0]||'') + (P.lastName[0]||'')).toUpperCase();
let n = 0;
const rise = () => `class="rise" style="--d:${n++}"`;

function render(first){
  const L = UI[lang]; n = 0;
  document.documentElement.lang = lang;
  document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = `${fullName} – ${tx(P.title)}`;
  const act = (href, ic, label, ext) => `<a class="act" href="${esc(href)}"${ext?' target="_blank" rel="noopener"':''}>${BR[ic]?brand(ic):`<span class="ico">${svg(ic)}</span>`}${esc(label)}</a>`;
  let h = `<div class="langs rise" style="--d:0">${['fr','ar','en'].map(k=>`<button data-l="${k}" aria-pressed="${k===lang}">${k==='ar'?'عربي':k.toUpperCase()}</button>`).join('')}</div>`;
  n = 1;
  h += `<section class="hero rise" style="--d:1"><div class="cover">${P.cover?`<img src="${esc(P.cover)}" alt="" onerror="this.remove()">`:''}</div><div class="avatar"><div><span>${esc(initials)}</span>${P.photo?`<img src="${esc(P.photo)}" alt="${esc(fullName)}" onerror="this.remove()">`:''}</div></div>
    <h1>${esc(fullName)}</h1>
    <p class="role">${esc([tx(P.title), P.company].filter(Boolean).join(' · '))}</p>
    ${P.available?`<span class="badge"><i></i>${L.avail}</span>`:''}
    ${tx(P.bio)?`<p class="bio">${esc(tx(P.bio))}</p>`:''}</section>`;
  n = 2;
  let a = '';
  if (P.phone) a += act('tel:'+P.phone,'phone',L.call);
  if (P.whatsapp) a += act('https://wa.me/'+P.whatsapp+(tx(P.whatsappText)?'?text='+encodeURIComponent(tx(P.whatsappText)):''),'whatsapp',L.wa,1);
  if (P.email) a += act('mailto:'+P.email,'mail',L.mail);
  if (P.website) a += act(P.website,'globe',L.web,1);
  if (P.address) a += act('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(P.address),'pin',L.map,1);
  h += `<div class="actions rise" style="--d:2">${a}</div>`;
  h += `<div class="cta rise" style="--d:3"><button class="btn" id="save">${L.save}</button><button class="btn alt" id="share">${L.share}</button></div>`;
  n = 4;
  if (P.services && P.services.length) h += `<section class="sec rise" style="--d:4"><h2>${L.services}</h2><div class="chips">${P.services.map(s=>`<span>${esc(tx(s))}</span>`).join('')}</div></section>`;
  if (P.gallery && P.gallery.length) h += `<section class="sec rise" style="--d:5"><h2>${L.gallery}</h2><div class="gal">${P.gallery.map(g=>`<a href="${esc(g)}" target="_blank" rel="noopener"><img src="${esc(g)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></a>`).join('')}</div></section>`;
  const soc = SOC_ORDER.filter(k => P.social && P.social[k]);
  if (soc.length) h += `<section class="sec rise" style="--d:6"><h2>${L.social}</h2><div class="soc">${soc.map(k=>`<a href="${esc(P.social[k])}" target="_blank" rel="noopener">${brand(k)}<span>${BR[k].name}</span></a>`).join('')}</div></section>`;
  const m = document.getElementById('card');
  m.style.setProperty('--base', first ? '1.5s' : '0s');
  m.innerHTML = h;
  document.getElementById('introTxt').textContent = L.tap;
  m.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { lang = b.dataset.l; try{localStorage.setItem('lang',lang)}catch(e){} render(false); });
  document.getElementById('save').onclick = saveVcf;
  document.getElementById('share').onclick = share;
}

function toast(t){ const e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); setTimeout(()=>e.classList.remove('on'),2200); }
async function share(){
  const d = { title: fullName, text: `${fullName} – ${tx(P.title)}`, url: location.href };
  try { if (navigator.share) await navigator.share(d); else { await navigator.clipboard.writeText(d.url); toast(UI[lang].copied); } } catch(e){}
}
function saveVcf(){
  const local = () => {
    const v = ['BEGIN:VCARD','VERSION:3.0',`N:${P.lastName};${P.firstName};;;`,`FN:${fullName}`,
      P.company&&`ORG:${P.company}`, tx(P.title)&&`TITLE:${tx(P.title)}`, P.phone&&`TEL;TYPE=CELL:${P.phone}`,
      P.email&&`EMAIL:${P.email}`, P.website&&`URL:${P.website}`, 'END:VCARD'].filter(Boolean).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([v],{type:'text/vcard'}));
    a.download = fullName.replace(/\s+/g,'_')+'.vcf';
    document.body.appendChild(a); a.click(); a.remove();
  };
  if (!location.protocol.startsWith('http')) return local();
  fetch('/api/contact',{method:'HEAD'}).then(r => r.ok ? (location.href = '/api/contact') : local()).catch(local);
}

render(true);
setTimeout(() => document.getElementById('intro').classList.add('off'), 1500);
</script>
